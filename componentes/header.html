<!-- Estructura modular del encabezado principal -->
<header class="header-custom-figma">
    <nav class="nav-custom-figma">
        
        <!-- Enlaces de navegación a las secciones de la tienda -->
        <div class="links-custom-figma">
            <a href="#" data-ruta="inicio" class="enlace-navegacion">Inicio</a>
            <a href="#" data-ruta="catalogo" class="enlace-navegacion">Catálogo</a>
            <a href="#" data-ruta="nosotros" class="enlace-navegacion">Nosotros</a>
            <a href="#" data-ruta="contacto" class="enlace-navegacion">Contáctenos</a>
        </div>

        <!-- Logotipo central en bloque flotante (estático, sin enlace a inicio) -->
        <div class="logo-custom-figma" id="imagenLogoHeaderContenedor" aria-label="Aguacate Make Up Logo">
            <img src="img/Logo transparente · Header · %238339B6.png" alt="Aguacate Make Up Logo" id="imagenLogoHeader">
        </div>

        <!-- Zona de interacción: buscador, acceso de usuario y carrito -->
        <div class="actions-custom-figma">
            <!-- Campo de búsqueda rápida de productos -->
            <div class="search-box-figma" id="formBusquedaHeader">
                <i class="bi bi-search search-icon-figma"></i>
                <input type="text" placeholder="Buscar..." id="inputBusquedaHeader">
            </div>

            <!-- Acceso al perfil de usuario (solo icono) -->
            <a href="#" class="action-btn-figma" id="enlaceCuenta" aria-label="Mi cuenta">
                <i class="bi bi-person icon-figma"></i>
            </a>

            <!-- Acceso al carrito de compras con contador numérico flotante -->
            <a href="#" class="action-btn-figma cart-btn-figma" id="enlaceCarrito" aria-label="Carrito de compras">
                <i class="bi bi-bag icon-figma"></i>
                <span class="cart-count-figma" id="contadorCarrito">0</span>
            </a>
        </div>

    </nav>
</header>
