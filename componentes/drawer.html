<!-- Fondo oscuro superpuesto -->
<div id="cart-overlay" class="cart-overlay"></div>

<!-- Panel lateral (Drawer) -->
<aside id="cart-drawer" class="cart-drawer" aria-label="Carrito de compras">
  <div class="cart-drawer-header">
    <h2>Tu Carrito</h2>
    <button id="close-cart-btn" class="close-cart-btn" aria-label="Cerrar carrito">&times;</button>
  </div>

  <div class="cart-drawer-body">
    <!-- Contenido dinámico del carrito -->
    <p class="cart-empty-msg">Tu carrito está vacío.</p>
  </div>

  <div class="cart-drawer-footer">
    <div class="cart-total">
      <span>Total:</span>
      <span id="cart-total-price">$0.00</span>
    </div>
    <button class="btn-checkout">Finalizar Compra</button>
  </div>
</aside>
