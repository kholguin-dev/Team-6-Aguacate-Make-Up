<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="../img/faviconbien.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <header id="header"></header>

    <!--hei primer seccion-->

    <!--stef  segunda  seccion-->

    <section id="seccion-universo" class="py-4">
      <div class="container-fluid px-0">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h2 class="universo-titulo mb-2">Encuentra tu universo</h2>
            <p class="universo-subtitulo mb-0">
              Todo lo que necesitas, organizado a tu manera.
            </p>
          </div>
          <button
            id="universo-siguiente"
            class="universo-flecha"
            aria-label="Siguiente categoría"
          >
            →
          </button>
        </div>

        <div class="universo-carrusel">
          <div id="universo-pista" class="universo-pista">
            <article class="universo-tarjeta">
              <img
                src="img/ImgT1.png"
                alt="Maquillaje"
                class="universo-imagen"
              />
              <div
                class="d-flex justify-content-between align-items-center mt-2"
              >
                <strong>Maquillaje</strong>
                <a href="#" class="universo-enlace">Explorar →</a>
              </div>
              <small class="universo-descripcion"
                >Cara · Ojos · Skincare · Cejas</small
              >
            </article>

            <article class="universo-tarjeta">
              <img src="img/ImgT2.png" alt="Skincare" class="universo-imagen" />
              <div
                class="d-flex justify-content-between align-items-center mt-2"
              >
                <strong>Bases</strong>
                <a href="#" class="universo-enlace">Explorar →</a>
              </div>
              <small class="universo-descripcion">Encuetra tu tono ideal</small>
            </article>

            <article class="universo-tarjeta">
              <img
                src="img/ImgT6.png"
                alt="Accesorios"
                class="universo-imagen"
              />
              <div
                class="d-flex justify-content-between align-items-center mt-2"
              >
                <strong>Accesorios</strong>
                <a href="#" class="universo-enlace">Explorar →</a>
              </div>
              <small class="universo-descripcion"
                >Brochas · Esponjas · Neceseres</small
              >
            </article>

            <article class="universo-tarjeta">
              <img
                src="img/ImgT4.png"
                alt="Productos de cuidado de la piel"
                class="universo-imagen"
              />
              <div
                class="d-flex justify-content-between align-items-center mt-2"
              >
                <strong>Skincare</strong>
                <a href="#" class="universo-enlace">Explorar →</a>
              </div>
              <small class="universo-descripcion"
                >Limpia · Hidrata · Cuida</small
              >
            </article>

            <article class="universo-tarjeta">
              <img
                src="img/ImgT5.png"
                alt="Tratamientos"
                class="universo-imagen"
              />
              <div
                class="d-flex justify-content-between align-items-center mt-2"
              >
                <strong>Todos</strong>
                <a href="#" class="universo-enlace">Explorar →</a>
              </div>
              <small class="universo-descripcion">Variedad para ti</small>
            </article>
          </div>
        </div>
      </div>
    </section>

    <footer class="py-4" id="footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/contacto.js"></script>
    <script src="script.js"></script>
  </body>
</html>
