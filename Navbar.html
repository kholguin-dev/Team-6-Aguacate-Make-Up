<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Fuentes: Roboto para la UI, Material Symbols para los iconos -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- CSS Personalizado -->
    <link href="style.css" rel="stylesheet" />
</head>

<body>
    <!-- ==========================================
     SECCIÓN 1: ENCABEZADO (Usando Bootstrap Navbar)
     ========================================== -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-2 py-lg-3">
        <div class="container-fluid px-3 px-lg-5">
            <!-- Logotipo -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <img src="src/image/logo.png" alt="Aguacate Make Up Logo" height="40" class="d-inline-block align-text-top" />
                <span class="fs-4 fw-bold text-white lh-1">Aguacate Make Up</span>
            </a>

            <!-- Botón Hamburguesa para Móvil -->
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido" aria-controls="navbarContenido" aria-expanded="false" aria-label="Alternar navegación">
                <span class="material-symbols-outlined text-white">menu</span>
            </button>

            <!-- Contenido Colapsable del Navbar -->
            <div class="collapse navbar-collapse" id="navbarContenido">
                
                <!-- Enlaces de Navegación -->
                <ul class="navbar-nav mx-auto mb-3 mb-lg-0 gap-lg-3 align-items-center mt-3 mt-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active px-2" aria-current="page" href="#hero">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="#catalogo">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="#nosotros">Nosotros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-2" href="#contacto">Contáctenos</a>
                    </li>
                </ul>

                <!-- Barra de Búsqueda y Acciones (Derecha) -->
                <div class="d-flex flex-column flex-lg-row align-items-center gap-3">
                    
                    <!-- Barra de Búsqueda -->
                    <div class="search-custom position-relative w-100" style="max-width: 400px;">
                        <input class="form-control rounded-pill py-2" type="search" placeholder="Buscar labiales, skincare..." aria-label="Buscar" />
                        <span class="material-symbols-outlined search-icon fs-5">search</span>
                    </div>

                    <!-- Acciones de Usuario y Carrito -->
                    <div class="d-flex align-items-center gap-3 mt-2 mt-lg-0 pb-2 pb-lg-0">
                        <!-- Mi Cuenta -->
                        <a href="#cuenta" class="btn-action btn-account d-flex align-items-center gap-2 px-3 py-2 rounded-pill">
                            <span class="material-symbols-outlined fs-5">person</span>
                            <span class="d-none d-xl-inline fw-medium fs-6">Mi Cuenta</span>
                        </a>
                        <!-- Carrito -->
                        <a href="#carrito" class="btn-action btn-cart d-flex align-items-center justify-content-center rounded-circle p-2">
                            <span class="material-symbols-outlined fs-5">shopping_bag</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Paquete JS de Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
